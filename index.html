<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#E6E9EE">
<meta name="description" content="Trapped Rat — slide the mouse through the maze to the cheese. Never cross your own trail.">
<title>Trapped Rat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Trapped Rat — UI ported from hiyroscript/shkr (Shadow Skirr): the same tokens, type, chips, bars, orb, wipe, cards and
   panels, trimmed to what this game uses. Stars are cheese: the real image when earned, its solid-black silhouette when
   not, and the silhouette filled with shkr's moving rainbow for a perfect run. */
:root{
  --paper:#EDEFF2; --paper-2:#DFE4EA; --paper-3:#C8CFD8;
  --ink:#0A0A10; --ink-2:#13131C; --mute:#7A8290;
  --pad:clamp(16px,3.4vw,32px);
  --col:min(100%,720px);
  --top:calc(var(--pad) + env(safe-area-inset-top));
  --bot:calc(var(--pad) + env(safe-area-inset-bottom));
  --bg:#EDEFF2; --surface:#FFFFFF; --fg:#0A0A10; --dim:#4A515C; --faint:#6D7684;
  --line:rgba(10,10,16,.15); --line-2:rgba(10,10,16,.08); --hover:rgba(10,10,16,.06);
  --thumb:rgba(10,10,16,.22); --track:rgba(10,10,16,.10);
  --done:#0A0A10; --danger:#BE0036; --danger-line:rgba(190,0,54,.40);
  --edge:var(--ink); --edge-w:2px; --tone-w:1.5px;
  --disp:"Space Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;
  --rainbow:linear-gradient(90deg,#FF2952,#FF9F1A,#FFEE1A,#1FE05C,#19E3E3,#3D6BFF,#A64DFF,#FF3DB5,#FF2952,#FF9F1A,#FFEE1A,#1FE05C,#19E3E3,#3D6BFF,#A64DFF,#FF3DB5,#FF2952);
  /* the cheese's outline (assets/cheese.png's alpha, 96 px) inline, so the silhouette and rainbow masks also work from file:// */
  --cheese:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGAAAABaCAQAAADtcJt4AAAJg0lEQVR42tWbW4xdZRXHf+v7zkyZmUM7tE5bYJCkirUClgfrJdFGMyZcYgI1qBiCkYhpJKbVCMGUB2IfMPHJmGjiCw8QFR8MptUgoBKFB6ikCdpEI5E0pBFCC1Kml+nsy/Lh3Pbe32Xvc9oyZ+Ykk3Obc9blv/7rv9a3By7OjwE+wp84w6vs7j5eRT8G4WqOoiQoyg8Au5ocsAgHUZbISElQdq0mFyywgLJMRk5OQsYx1iPIajBfMAjPdh3o3JZRfrpacmCBO1GSvvkZGQk5n14NxSwYNvBaFzhZKQeHmMSOO4ws8OMSfIou7Bt3GBlgO0ukpAXTO49SUk5x3XjDyAC/98Q/7efgeez4wsgCNzvlW7ydQ9k7rjASDJMc9jrQg1RKykmuGU8YWeBb3vLtGD6A0VPI+OVAEC7jNTIvgNJCWS+j7B4/GFng4UD8yw6kZLzJlcg4wcggXMNihT6rFVDsCL8crxxY4PFg/F2HEpRbxscFC+x0xEPslpDzL9qY8+8I9gIB6FGuJqugWoPmCRkbSXgWi46n+uzd8u5MUK2GjrD46Mp3BMHQ5t9RAPkc6JTy0ytfBxZ4INi+BlkoP9OrBOWOlXXBIGziOBlpwczciXYnB6njQM5RZs+vlO15OpCznwWSwudI8F51JhYy1iM8s1KlbBA+zOlA+yqj39/UUlLOcO1KdWULPIZyLmK+64I7px1YmTowwA6WveLZ50AabGrKbSvhggH+EJQPeeHm00NFOs35J9MXoisPC5+bItNXHol/SuII7O+/1zkwtHgBJQmgPBz9lKTiQGdO2zJaKZsR459zO58gxaBeCtT+b3WeFedxzlr2R7TTRZi+LuVIST6kEfFcvLmPe1nJWBgFRmYkB5Q2m/qNSUtR9WWi57YU7kmhsQmK4UdMDp+FUQpHMSyykw91BbRETe8Z6uvQxUCmzPMWLwzblc1IBWwQ5iNxL5qqjqzQwHtz9rGZfDibRnEgJ+UutpPW/rV6ntGgJSkbeehil7LF0mYf70YLt1y81Wdio2bCxy5mR+jE5hG0xnh/761yf1ZyrtfSfnfxHDDADfyCnHPdLwxLtdTrQNWV1DvuD7WvkKHYfwOHme9jXwIol0IFiKeBaamUyxZkTPASnyInv9A0asn5GTtZolXi8HBYpGKeFEKhgTAaMuZ5hZeb0qk0Nj/jJp4szF5S8wXqxLz8mpZcKnKc5T/cwNkIYw2dAQGm+Q1zDskVwVGFjC/+WsoD3vdlzPEGLzbLgWk8++5hG0nk/Rq9F+8OrlS5n/XNWpptZL6yhceYcEQBlWpwyzr8mpTUUXXYv4xF/oqpz4E0xP/jfMXpvIMq0CArSVDahfIo3d/HuZ7jtZXWIEmWjM9yO2nwcE4jxNv02YHM6FRSyia+2QQhpoH2bPFDrIcTtMZ8f0VoiWZDNSQobzaol1oHLDlf4pOkWAfDvriKY5YEQaWRXLRIeK6JA61aPpjhIQ/WY/CRCBm4iNeAtG6xrsmmwtTS5z1sJetiURxWH6YdagRq2r/1JIXhC+S06j67ThDM8g8uDwBBa8bJcozj79IKGBXhJJ/ncDeMI/UBS873uM07uEiQU7TynERrp7y5GPQZQZnmi5zmdU7GnJco/t/HEea8HbFolnpKWoPQ8VVQuT8M+MsC73Ajh7Bkw9aAAXazyTn5qiZda9CuwXFSK1O2OOuAjCVmeTjGRqaGo+oUp9Y0M20wDfvFd+e5SRIWuJE8BPa4ODtIHtGE2oAcJKg7NdKXqzWzn4nQt5ma4zsTaDfqXVkNzNICEHr3Tfd+3TKyTNeGhI+zK5QDEzTfkrMLKRSPNmhb4h11JBhjrXyyeBhLUB7kEn8owzSasYOfdMdHPBwjwcHSN0qWYSRRveo7S7uCY7zkg7MJ6MV13MtBZrpe+7R }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#E6E9EE;color:var(--ink);font-family:var(--disp);font-weight:500;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:3px}
.hide{display:none !important}

#cv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;transition:filter .35s ease}
/* home: the live demo behind the menu, a touch out of focus (the paper wash is drawn on the canvas) */
body.home #cv{filter:blur(1.2px)}
@media (prefers-reduced-motion:reduce){body.home #cv{filter:none}}

.screen{position:fixed;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;
  padding:var(--top) var(--pad) var(--bot)}
.screen.on{display:flex}
.screen.paper{background:var(--bg);color:var(--fg)}
.screen.enter{animation:fadeUp .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.col{width:var(--col);display:flex;flex-direction:column;min-height:0;flex:1;position:relative}

.tag{font-family:var(--mono);font-size:clamp(9px,2.4vw,11px);letter-spacing:.18em;text-transform:uppercase;
  color:var(--faint);white-space:nowrap}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto;width:100%}
.bar nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-family:var(--mono);font-size:clamp(9px,2.4vw,11px);letter-spacing:.14em;text-transform:uppercase;
  padding:10px 14px;border-radius:100px;border:1px solid var(--line);color:var(--fg);
  white-space:nowrap;transition:background .16s,border-color .16s,transform .1s,opacity .16s}
.chip:hover{background:var(--hover)}
.chip:active{transform:scale(.96)}
.chip.solid{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.solid:hover{opacity:.88;background:var(--fg)}
.chip.danger{border-width:var(--tone-w);padding:9.5px 13.5px;color:var(--danger);border-color:var(--danger)}
#home .chip,#home .arrow{background:#fff}
/* white pills for the tags over the demo; the header's "hiyroscript" stays plain .tag text */
#home main .tag,#home footer .tag{background:#fff;padding:6px 11px;border-radius:100px;color:var(--dim)}
#home .rail{box-shadow:0 0 0 3px #fff;background:var(--paper-3)}
#home .pulse i{box-shadow:0 0 0 4px #fff}

/* home: the single levels card */
#home .mid{flex:1;width:100%;min-height:0;position:relative;display:flex}
.hcard{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:6px 0}
.title{font-size:clamp(30px,min(10vw,12.5vh),104px);font-weight:700;letter-spacing:-.045em;line-height:.88;
  text-transform:uppercase;text-align:center;color:var(--fg);margin-top:clamp(6px,1.2vh,12px);max-width:13ch;text-wrap:balance}
.title span{display:inline-block;animation:letterIn .55s cubic-bezier(.2,.9,.2,1) both}
@keyframes letterIn{from{opacity:0;transform:translateY(16px) scaleY(.92)}to{opacity:1;transform:none}}
.play-row{margin-top:clamp(14px,3.2vh,40px);display:flex;align-items:center;gap:clamp(18px,5vw,40px)}
.pulse{position:relative;width:clamp(64px,12vh,96px);height:clamp(64px,12vh,96px);border-radius:50%;
  display:grid;place-items:center;transition:transform .12s;flex:0 0 auto}
.pulse:active{transform:scale(.92)}
.pulse i{position:absolute;inset:0;border-radius:50%;background:var(--ink);animation:breathe 1.6s ease-in-out infinite}
.pulse b{position:absolute;inset:0;border-radius:50%;border:2px solid var(--ink);animation:halo 1.6s ease-out infinite}
.pulse u{position:relative;z-index:1;width:27.7%;height:32%;margin-left:4.4%;background:#fff;clip-path:polygon(0 0,100% 50%,0 100%);
  pointer-events:none;animation:breathe 1.6s ease-in-out infinite}
.pulse.locked i{background:var(--paper-3);animation:none;transform:scale(.86)}
.pulse.locked b,.pulse.locked u{display:none}
.pulse.locked::after{content:"";position:relative;width:26%;height:22%;border-radius:3px;background:var(--ink);margin-top:14%}
.pulse.locked::before{content:"";position:absolute;width:16%;height:18%;border:3px solid var(--ink);border-bottom:none;
  border-radius:20px 20px 0 0;top:31%;z-index:1}
@keyframes breathe{0%,100%{transform:scale(.86)}50%{transform:scale(1)}}
@keyframes halo{0%{transform:scale(.9);opacity:.65}100%{transform:scale(1.42);opacity:0}}
.arrow{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:var(--edge-w) solid var(--edge);flex:0 0 auto;
  transition:transform .1s,opacity .16s,background .16s}
.arrow::before{content:"";width:9px;height:9px;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);
  transform:translateX(2px) rotate(45deg)}
.arrow.next::before{transform:translateX(-2px) rotate(-135deg)}
.arrow:active{transform:scale(.92)}
.arrow:disabled{opacity:.25;cursor:default}
#startLbl{margin-top:clamp(12px,2.2vh,22px);text-align:center}
.rail{flex:1;height:2px;background:var(--track);position:relative;border-radius:2px;min-width:40px}
.rail-fill{position:absolute;inset:0 auto 0 0;background:var(--fg);border-radius:2px;
  transition:width .5s cubic-bezier(.2,.8,.2,1)}

/* cheese (the stars): earned = the image, not earned = its black silhouette, value 4 = three rainbow ones */
.stars{display:flex;gap:.28em;justify-content:center;font-size:clamp(20px,3.8vh,30px);margin-top:clamp(8px,1.4vh,14px);min-height:1em}
.cheese{width:1.07em;height:1em;flex:0 0 auto;background:#0A0A10;
  -webkit-mask:var(--cheese) center/contain no-repeat;mask:var(--cheese) center/contain no-repeat}
.cheese.on{background:var(--cheese-img) center/contain no-repeat;-webkit-mask:none;mask:none}
.cheese.rb{background:var(--rainbow);background-size:200% 100%;animation:rb 1.8s linear infinite}
@keyframes rb{from{background-position:0% 0}to{background-position:100% 0}}
.stars.big{font-size:clamp(44px,12vw,68px);margin:14px 0 6px}
.stars.big .cheese{transform:scale(0)}
.stars.big .cheese.pop{animation:starPop .5s cubic-bezier(.2,1.5,.4,1) forwards}
.stars.big .cheese.rb.pop{animation:starPop .5s cubic-bezier(.2,1.5,.4,1) forwards,rb 1.3s linear infinite,shim 1.1s ease-in-out infinite .5s}
@keyframes starPop{0%{transform:scale(0) rotate(-50deg)}70%{transform:scale(1.28) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
@keyframes shim{0%,100%{filter:brightness(1) saturate(1)}50%{filter:brightness(1.25) saturate(1.3)}}

/* wipe */
#wipe{position:fixed;z-index:50;width:10px;height:10px;border-radius:50%;background:var(--ink);
  transform:scale(0);pointer-events:none;display:none}
#wipe.go{display:block;animation:wipeOut .62s cubic-bezier(.65,0,.35,1) forwards}
#wipe.go.fade{transition:opacity .32s ease;opacity:0}
@keyframes wipeOut{to{transform:scale(var(--sc,60))}}

/* panels */
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-bottom:clamp(12px,2vh,20px);flex:0 0 auto;width:100%}
.panel-title{font-size:clamp(24px,5.6vw,40px);font-weight:700;letter-spacing:-.03em;text-transform:uppercase;line-height:1;color:var(--fg)}
.panel-body{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  touch-action:pan-y;min-height:0;width:100%;padding-bottom:24px;scrollbar-width:thin;scrollbar-color:var(--thumb) transparent}
.set-row{display:flex;align-items:center;gap:18px;padding:16px 0;border-bottom:1px solid var(--line-2)}
.set-row .lbl{flex:1;min-width:0}
.set-row .lbl b{display:block;font-weight:500;font-size:15px}
.set-row .lbl span{font-size:12px;color:var(--faint);line-height:1.45;display:block;margin-top:3px}
.set-ctl{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.sw{width:46px;height:26px;border-radius:100px;background:var(--track);position:relative;flex:0 0 auto;transition:background .18s;
  border:var(--edge-w) solid var(--edge)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;
  background:var(--fg);transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.sw[aria-pressed=true]{background:var(--fg)}
.sw[aria-pressed=true]::after{transform:translateX(20px);background:var(--bg)}
@media (max-width:560px){
  .set-row{flex-direction:column;align-items:stretch;gap:12px}
  .set-ctl{justify-content:flex-end}
  .set-row.one{flex-direction:row;align-items:center}
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.cell{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  font-family:var(--mono);font-size:14px;color:var(--fg);transition:transform .12s,background .16s,border-color .16s}
.cell:active{transform:scale(.94)}
.cell.locked{color:var(--line);border-color:var(--line-2);cursor:not-allowed}
.cell.done{background:rgba(10,10,16,.05);border-color:rgba(10,10,16,.34)}
.cell.next{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cell .stars{font-size:9px;margin:0;gap:2px;min-height:9px}
.cell.next .cheese:not(.on):not(.rb){background:rgba(237,239,242,.35)}

/* HUD: level, the 60 s clock, pause; the rail is the clock draining */
#hud{position:fixed;inset:0;z-index:8;display:none;flex-direction:column;pointer-events:none;
  padding:calc(10px + env(safe-area-inset-top)) var(--pad) calc(16px + env(safe-area-inset-bottom));color:var(--ink)}
#hud.on{display:flex}
.hud-rail{height:4px;border-radius:4px;background:#fff;box-shadow:inset 0 0 0 1px var(--ink);overflow:hidden;width:100%}
.hud-rail i{display:block;height:100%;width:100%;background:var(--ink);transform-origin:left;transform:scaleX(1)}
.hud-top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:10px}
.meta{font-family:var(--mono);font-size:clamp(9px,2.3vw,11px);letter-spacing:.15em;text-transform:uppercase;
  color:rgba(10,10,16,.62);min-width:0;background:#fff;padding:6px 11px;border-radius:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta b{color:var(--ink);font-weight:700}
.hud-right{display:flex;gap:12px;align-items:center;flex:0 0 auto}
.meta.clock{font-size:clamp(13px,3.4vw,16px);font-weight:700;letter-spacing:.04em;color:var(--ink);font-variant-numeric:tabular-nums;
  padding:7px 13px;transition:background .2s,color .2s}
#hud.danger .hud-rail{box-shadow:inset 0 0 0 1px var(--danger)}
#hud.danger .hud-rail i{background:var(--danger)}
#hud.danger .clock{background:var(--danger);color:#fff;animation:dangerPulse 1s ease-in-out infinite}
@keyframes dangerPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
#pauseBtn{pointer-events:auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  border:var(--edge-w) solid var(--edge);color:var(--ink);flex:0 0 auto;background:#fff}
#pauseBtn::before{content:"";width:4px;height:12px;border-left:3px solid;border-right:3px solid;box-sizing:content-box}

/* overlay cards: pause, level cleared, failed, confirm */
#overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
  padding:calc(var(--top) + 8px) var(--pad) calc(var(--bot) + 8px);background:rgba(6,6,10,.72);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--fg);text-align:center;
  overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
#overlay.on{display:flex}
#overlay.out{animation:ovOut .2s ease forwards;pointer-events:none}
@keyframes ovOut{to{opacity:0}}
.card{max-width:430px;width:100%;margin:auto;animation:cardIn .28s cubic-bezier(.2,.8,.2,1) both;
  background:var(--surface);border:1px solid var(--line);border-radius:22px;
  padding:clamp(24px,4vw,34px) clamp(20px,4vw,32px);box-shadow:0 24px 70px rgba(0,0,0,.45)}
@keyframes cardIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
.card .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--faint)}
.card.fail .eyebrow{color:var(--danger)}
.card h2{font-size:clamp(28px,6.4vw,48px);font-weight:700;letter-spacing:-.035em;line-height:1;margin:12px 0;text-transform:uppercase;color:var(--fg);text-wrap:balance}
.card p{color:var(--dim);font-size:clamp(14px,2.6vw,15px);line-height:1.6;max-width:36ch;margin:0 auto;text-wrap:pretty}
.card .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:clamp(20px,3.4vh,28px);transition:opacity .15s ease}
.card.arming .acts{opacity:.45}
.stat-row{display:flex;justify-content:center;gap:clamp(18px,6vw,30px);margin-top:16px;flex-wrap:wrap}
.stat-row div{text-align:center}
.stat-row b{font-family:var(--mono);font-size:19px;font-weight:400;display:block;font-variant-numeric:tabular-nums}
.stat-row span{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.stat-row .new{color:#B88400}
@media (max-height:430px){
  .title{font-size:clamp(26px,11vh,56px)}
  .play-row{margin-top:8px}
  .pulse{width:56px;height:56px}
  #startLbl{margin-top:6px}
  .stars{margin-top:4px}
  .stars.big{margin:6px 0 2px}
}
@media (prefers-reduced-motion:reduce){
  .pulse i,.pulse b,.pulse u{animation:none}
  #hud.danger .clock{animation:none}
}
</style>
</head>
<body class="home">

<canvas id="cv"></canvas>
<div id="wipe"></div>

<section id="home" class="screen">
  <div class="col">
    <header class="bar">
      <span class="tag">hiyroscript</span>
      <nav><button class="chip" data-go="settings">settings</button></nav>
    </header>
    <main class="mid">
      <section class="hcard" id="cardLv" role="region" aria-label="Levels">
        <span class="tag" id="lvTag">level 01</span>
        <h1 class="title" id="title"></h1>
        <div class="stars" id="homeStars"></div>
        <div class="play-row">
          <button class="arrow" id="prevBtn" aria-label="Previous level"></button>
          <button class="pulse" id="startOrb" aria-label="Play"><i></i><b></b><u aria-hidden="true"></u></button>
          <button class="arrow next" id="nextBtn" aria-label="Next level"></button>
        </div>
        <span class="tag" id="startLbl">play</span>
      </section>
    </main>
    <footer class="bar" id="homeFoot">
      <button class="chip" data-go="levels">levels</button>
      <div class="rail"><div class="rail-fill" id="railFill" style="width:0%"></div></div>
      <span class="tag" id="progTag">01 / 30</span>
    </footer>
  </div>
</section>

<section id="settings" class="screen paper">
  <div class="col">
    <div class="panel-head">
      <h2 class="panel-title">Settings</h2>
      <button class="chip" data-go="home">close</button>
    </div>
    <div class="panel-body">
      <div class="set-row">
        <div class="lbl"><b>Screen shake</b><span>A short shake when the rat hits its trail or a hazard.</span></div>
        <div class="set-ctl"><button class="sw" id="shakeSw" aria-pressed="true" aria-label="Screen shake"></button></div>
      </div>
      <div class="set-row one">
        <div class="lbl"><b>Reset progress</b></div>
        <div class="set-ctl"><button class="chip danger" id="resetBtn">reset</button></div>
      </div>
    </div>
  </div>
</section>

<section id="levels" class="screen paper">
  <div class="col">
    <div class="panel-head">
      <h2 class="panel-title">Levels</h2>
      <button class="chip" data-go="home">close</button>
    </div>
    <div class="panel-body">
      <div class="grid" id="lvGrid"></div>
    </div>
  </div>
</section>

<div id="hud">
  <div class="hud-rail"><i id="hudFill"></i></div>
  <div class="hud-top">
    <div class="meta" id="hudLevel"></div>
    <div class="hud-right">
      <div class="meta clock" id="hudClock">1:00</div>
      <button id="pauseBtn" aria-label="Pause"></button>
    </div>
  </div>
</div>

<div id="overlay"><div class="card" id="card"></div></div>

<script>
/* ---- sim.js ----
   SIM: the whole game rule set as pure, deterministic logic on a fixed 60 Hz tick. The game, the home demo, the
   solver and the Node tools all step the same code, so a solution the tools verify plays out identically on screen.

   Grid: 0 void (outside the maze shape), 1 wall, 2 floor. Special tiles sit on floor (or, for the fan, on a wall).
   Directions: 0 up, 1 right, 2 down, 3 left.

   A move: the rat slides in a direction until something stops it (a wall, a glue pad, a closed door or gate, a fan
   it can't turn on), with one eased tween over the whole slide. The slide is planned the moment it starts (every
   obstacle's timing is a pure function of the level clock, so the plan is exact) and then played tick by tick,

  const MIN_T = 6, MAX_T = 45;       /* slide duration clamp in ticks: 0.1 s (short slides stay snappy) .. 0.75 s */
  const BUMP_T = 5;                  /* a move that goes nowhere but does something (turning a fan, hitting the trail) */
  const EASE_A = 0.6;                /* 0 = linear, 1 = full ease-out */
  const K = { NONE: 0, TRAP: 1, GLUE: 2, PUDDLE: 3, CRACK: 4, CONV: 5, PORTAL: 6, DOOR: 7, PLATE: 8, GATE: 9, FAN: 10 };
  const HIT = { robot: 0.72, snake: 0.66, chaser: 0.7 };   /* contact distances in tiles */
  const PAW = { strike: 0.45, warn: 0.65 };                /* seconds */
  const LASER_WARN = 0.45;

  function ease(u) { u = u < 0 ? 0 : u > 1 ? 1 : u; return u * (1 - EASE_A) + EASE_A * (1 - (1 - u) * (1 - u)); }
  function easeInv(s) { let a = 0, b = 1; for (let i = 0; i < 26; i++) { const m = (a + b) / 2; if (ease(m) < s) a = m; else b = m; } return (a + b) / 2; }

  /* ---------------- compile a level definition ---------------- */
  function polyline(pts, closed) {
    const P = pts.map(function (p) { return [p[0], p[1]]; });
    if (closed) P.push([P[0][0], P[0][1]]);

    for (let i = 1; i < P.length; i++) cum.push(cum[i - 1] + Math.abs(P[i][0] - P[i - 1][0]) + Math.abs(P[i][1] - P[i - 1][1]));

      portals: [], doors: [], fans: [], plates: [], gates: [], lasers: [], paws: [], robots: [], snakes: [], chaser: null, convs: [] };

        case "crack": k[at(o.x, o.y)] = K.CRACK; break;

        case "gate": { const i = at(o.x, o.y); k[i] = K.GATE; kv[i] = L.gates.length; L.gates.push({ i: i, id: o.id, ax: o.ax, plates: [] }); break; }

        case "robot": L.robots.push({ pl: polyline(o.path, false), v: o.v, ph: o.ph }); break;

    DEMO.stop();
    hud.classList.add("on");
    $("#hudLevel").innerHTML = "level <b>" + pad2(n) + "</b> &nbsp;·&nbsp; " + esc(LEVELS[n - 1].name);
    RENDER.setLevel(G.L);
    hudInsets();
    beginRun();
  }
  function beginRun() {
    const r = rec(G.n); r.t++; saveState();
    G.st = SIM.newState(G.L); G.acc = 0; G.paused = false; G.bump = null; G.squash = 0; G.mode = "play";
    RENDER.setLevel(G.L); RENDER.anim.ang = 0;
    hideCard(); paintHud(true);
  }
  let lastClock = "", lastDanger = null;
  function paintHud(force) {
    if (!G.st) return;
    const left = (LIMIT - G.st.t) / HZ, txt = clockText(left), danger = left <= 10 && G.st.out !== "win";
    if (txt !== lastClock || force) { hudClock.textContent = txt; lastClock = txt; }
    if (danger !== lastDanger || force) { hud.classList.toggle("danger", danger); lastDanger = danger; }
    hudFill.style.transform = "scaleX(" + Math.max(0, Math.min(1, left / 60)).toFixed(4) + ")";
  }
  function tryMove(d) {
    if (G.mode !== "play" || G.paused || G.cardUp || !G.st || G.st.out || G.st.sl) return;
    SIM.move(G.L, G.st, d);
    onEvents();
  }
  const WHY = {
    trail: ["crossed your own trail", "Trail crossed", "The rat can't stop mid-slide: plan each slide so it never runs back over the trail."],
    trap: ["snapped by a mousetrap", "Snap!", ""], robot: ["vacuumed up", "Vacuumed", ""], paw: ["caught by the cat", "Swiped!", ""],
    laser: ["zapped by a laser", "Zapped", ""], snake: ["the snake got you", "Bitten", ""], chaser: ["the chaser caught you", "Caught", ""],
    time: ["the clock ran out", "Out of time", ""], stuck: ["no way out", "Trapped", "Every way out is a wall or your own trail."]
  };
  function onEvents() {
    const st = G.st, ev = st.ev; if (!ev || !ev.length) return;
    const p = SIM.ratPos(G.L, st, 0), x = p[0] + 0.5, y = p[1] + 0.5;
    for (const e of ev) {
      switch (e.e) {
        case "bump": G.bump = { d: e.d, t: 0 }; if (S.shake) RENDER.shake(0.25); break;
        case "stop": G.squash = Math.min(1, 0.3 + e.n * 0.08); RENDER.emit(x + SIM.DX[e.d] * 0.38, y + SIM.DY[e.d] * 0.38, 4 + Math.min(8, e.n), { sp: 1.8, life: 0.4, sz: 0.05 }); break;
        case "crack": { const i = e.i; RENDER.emit(i % G.L.w + 0.5, (i / G.L.w | 0) + 0.5, 10, { sp: 2, life: 0.5, sz: 0.06, col: "#3A3A48" }); break; }
        case "splash": RENDER.emit(x, y, 6, { sp: 2.2, life: 0.4, sz: 0.05, col: "rgba(64,150,230,.8)" }); break;
        case "plate": RENDER.emit(x, y, 8, { sp: 1.6, life: 0.5, sz: 0.05, col: "#2F80ED" }); break;
        case "portal": { const b = e.b; RENDER.emit(b % G.L.w + 0.5, (b / G.L.w | 0) + 0.5, 10, { sp: 2, life: 0.45, sz: 0.05, col: "#9B51E0" }); break; }
        case "fan": RENDER.emit(x, y, 4, { sp: 1.2, life: 0.3, sz: 0.04, col: "#FF6A13" }); break;
        case "win": win(); break;
        case "die": die(e.why, e.hit); break;
      }
    }
    ev.length = 0;
  }
  function die(why, hitTile) {
    if (G.mode !== "play") return;
    G.mode = "dead"; G.deadAt = now();
    const st = G.st, ri = st.y * G.L.w + st.x;
    RENDER.hit(why === "trail" ? hitTile : why === "time" || why === "stuck" ? -1 : ri, why);
    if (why === "trap") RENDER.snapTrap(ri);
    if (S.shake) RENDER.shake(why === "time" ? 0.4 : 1);
    if (navigator.vibrate && S.shake) try { navigator.vibrate(60); } catch (e) {}
    const n = G.n, w = WHY[why] || ["failed", "Failed", ""];
    setTimeout(function () {
      if (G.mode !== "dead" || G.n !== n) return;
      showCard({ cls: "fail", eyebrow: "level " + pad2(n) + "  ·  " + w[0], title: w[1], body: w[2] || "",
        stats: [[rec(n).t, "attempts"]].concat(rec(n).d ? [[clockText(rec(n).b, true), "best time"]] : []),
        acts: [{ t: "retry", solid: true, fn: function () { beginRun(); } }, { t: "home", fn: goHome }] });
    }, why === "time" ? 400 : 750);
  }
  function win() {
    if (G.mode !== "play") return;
    G.mode = "won"; G.wonAt = now();
    const st = G.st, n = G.n, taken = st.t / HZ, left = (LIMIT - st.t) / HZ, v = cheeseFor(left);
    const r = rec(n), firstClear = !r.d, newBest = !r.d || taken < r.b - 1e-9;
    r.d = true; r.s = Math.max(r.s || 0, v); if (newBest) r.b = +taken.toFixed(3);
    if (n < N && S.unlocked < n + 1) S.unlocked = n + 1;
    saveState();
    const c = G.L.cheese; RENDER.emit(c % G.L.w + 0.5, (c / G.L.w | 0) + 0.5, 34, { sp: 4, life: 1, sz: 0.07, col: "#FFC83A" });
    setTimeout(function () {
      if (G.mode !== "won" || G.n !== n) return;
      const acts = [];
      if (n < N) acts.push({ t: "next", solid: true, fn: function () { S.sel = n + 1; saveState(); startLevel(n + 1); } });
      acts.push({ t: "retry", solid: n >= N, fn: function () { beginRun(); } });
      acts.push({ t: "home", fn: function () { if (n < N) S.sel = n + 1; saveState(); goHome(); } });
      showCard({ eyebrow: "level " + pad2(n) + " cleared" + (n >= N ? "  ·  all done" : firstClear && n < N ? "  ·  level " + pad2(n + 1) + " unlocked" : ""), title: esc(LEVELS[n - 1].name), stars: v,
        stats: [[clockText(taken, true), "time"], [clockText(r.b, true), newBest && !firstClear ? "new best" : "best", newBest && !firstClear], [clockText(left), "left"]], acts: acts });
    }, 900);
  }
  function goHome() { hideCard(); G.paused = false; show("home"); startHome(); }

  /* ---------------- pause ---------------- */
  function pauseGame() {
    if (G.mode !== "play" || G.paused || G.cardUp) return;
    G.paused = true;
    showCard({ eyebrow: "level " + pad2(G.n) + "  ·  " + clockText((LIMIT - G.st.t) / HZ) + " left", title: "Paused",
      acts: [{ t: "resume", solid: true, fn: resumeGame }, { t: "restart", fn: function () { beginRun(); } }, { t: "home", fn: goHome }] });
  }
  function resumeGame() { if (!G.paused) return; hideCard(true); G.paused = false; G.acc = 0; }
  $("#pauseBtn").addEventListener("click", function (e) { e.stopPropagation(); pauseGame(); });
  document.addEventListener("visibilitychange", function () { if (document.hidden) pauseGame(); });
  window.addEventListener("blur", pauseGame);

  /* ---------------- input ---------------- */
  const KEYS = { ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1], ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0] };
  window.addEventListener("keydown", function (e) {
    const c = e.code;
    if (c === "Escape" || (c === "KeyP" && G.mode === "play")) {
      if (G.mode === "play" && !G.paused && !G.cardUp) pauseGame();
      else if (G.paused) resumeGame();
      else if (!G.cardUp && panelOn()) show("home");
      else if (G.cardUp && G.mode === "home") hideCard();
      return;
    }
    if (c === "KeyR" && (G.mode === "play" || G.mode === "dead" || G.mode === "won")) { e.preventDefault(); beginRun(); return; }
    if (G.cardUp) { if ((c === "Enter" || c === "Space") && cardActs[0] && !e.repeat && now() - cardAt >= CARD_ARM) { e.preventDefault(); cardActs[0].fn(); } return; }
    if (G.mode === "play") {
      const v = KEYS[c];
      if (v) { e.preventDefault(); if (!e.repeat) tryMove(RENDER.toGrid(v[0], v[1])); }
    } else if (G.mode === "home" && $("#home").classList.contains("on")) {
      if (c === "Enter" || c === "Space") { e.preventDefault(); launch(); }
      else if (c === "ArrowLeft" || c === "KeyA") browse(-1); else if (c === "ArrowRight" || c === "KeyD") browse(1);
    }
  });
  /* swipe (touch) or drag (mouse): one move per gesture, once it has gone SWIPE px */
  const SWIPE = 24, cv = $("#cv");
  let ptr = null;
  cv.addEventListener("pointerdown", function (e) {
    if (G.mode !== "play") return;
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    ptr = { id: e.pointerId, x: e.clientX, y: e.clientY, done: false };
  }, { passive: false });
  cv.addEventListener("pointermove", function (e) {
    if (!ptr || ptr.id !== e.pointerId || ptr.done) return;
    const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y;
    if (dx * dx + dy * dy < SWIPE * SWIPE) return;
    ptr.done = true;
    tryMove(RENDER.toGrid(dx, dy));
  });
  const up = function (e) { if (ptr && ptr.id === e.pointerId) ptr = null; };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

  /* ---------------- main loop ---------------- */
  let last = 0, slow = 0, lowQ = false;
  function loop(ts) {
    requestAnimationFrame(loop);
    const t = ts / 1000, dt = Math.min(0.05, Math.max(0.001, t - last)); last = t;
    if (G.mode === "home" || G.mode === "launch") { DEMO.update(dt); DEMO.draw(t, dt); return; }
    const st = G.st; if (!st) return;
    if (G.mode === "play" && !G.paused) {
      G.acc += dt;
      let n = 0;
      while (G.acc >= 1 / HZ && n++ < 8) { G.acc -= 1 / HZ; SIM.step(G.L, st); onEvents(); if (st.out || G.mode !== "play") break; }
      if (G.acc > 0.2) G.acc = 0;
      paintHud(false);
    }
    if (G.bump) { G.bump.t += dt; if (G.bump.t > 0.2) G.bump = null; }
    G.squash = Math.max(0, G.squash - dt * 6);
    const live = G.mode === "play" && !G.paused && !st.out;
    RENDER.frame({ st: st, sub: live ? G.acc * HZ : 0, t: t, dt: G.paused ? 0 : dt, home: false, won: G.mode === "won", wonT: G.mode === "won" ? now() - G.wonAt : 0,
      noShake: !S.shake, bump: G.bump, squash: G.squash });
    /* drop resolution once if the device cannot hold 60 fps */
    if (G.mode === "play" && !G.paused && !lowQ) { slow = dt > 0.024 ? slow + 1 : Math.max(0, slow - 0.25); if (slow > 90) { lowQ = true; RENDER.setQuality(0.75); } }
  }

  /* ---------------- boot ---------------- */
  const imgs = { rat: new Image(), cheese: new Image() };
  imgs.rat.src = window.ASSETS.rat; imgs.cheese.src = window.ASSETS.cheese;
  RENDER.init(cv, imgs);
  let rz = 0;
  const onResize = function () {
    clearTimeout(rz);
    rz = setTimeout(function () { RENDER.resize(); if (G.mode === "home" || G.mode === "launch") RENDER.setInsets(0, 0, true); else hudInsets(); }, 100);
  };
  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", function () { setTimeout(onResize, 160); });
  startHome(); show("home");
  requestAnimationFrame(loop);
  /* a handle for tests and the console */
  window.__TRAPPEDRAT = { G: G, S: function () { return S; }, startLevel: startLevel, beginRun: beginRun, tryMove: tryMove, show: show, goHome: goHome,
    cheeseFor: cheeseFor, RATING: RATING, saveState: saveState, setS: function (o) { S = checkState(o || {}); saveState(); return S; } };
})();
</script>
</body>
